name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate SQL scripts
        run: |
          python - <<'PY'
          import glob

          files = sorted(glob.glob("sql/*.sql"))
          assert len(files) == 15, f"expect 15 sql files, got {len(files)}: {files}"
          for f in files:
              body = open(f, encoding="utf-8").read()
              assert "data" in body, f"{f} 未引用 data 表"
              assert ";" in body, f"{f} 缺少语句结束符"
          print("SQL OK:", len(files), "files")
          PY

      - name: Generate demo data
        run: python src/make_demo_data.py

      - name: Clean & validate schema
        run: python src/clean.py --data data/telco_demo.csv --out data/telco_clean.csv

      - name: A/B test analysis
        run: python src/abtest_analysis.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: results/
          retention-days: 7
