name: ml

# 模型训练依赖较重（RandomForest / HistGradientBoosting），不随每次推送运行。
# 需要时手动触发：Actions → ml → Run workflow
#
# 说明：为保证可复现，本工作流**固定现场生成演示数据**再训练，
# 不读取仓库里的任何 CSV，避免文件编码/换行差异导致的解析问题。
on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate demo data
        run: |
          python src/make_demo_data.py --out data/_ci_demo.csv
          echo "--- 前 3 行 ---"
          head -3 data/_ci_demo.csv
          echo "--- 文件信息 ---"
          ls -l data/_ci_demo.csv

      - name: Train & evaluate
        run: python src/ml_churn.py --data data/_ci_demo.csv --out results

      - name: Upload metrics & figures
        uses: actions/upload-artifact@v4
        with:
          name: ml-outputs
          path: results/
          retention-days: 14
