name: ml

# 模型训练依赖较重（RandomForest / HistGradientBoosting），不随每次推送运行。
# 需要时手动触发：Actions → ml → Run workflow
#
# 数据策略：优先用仓库内的真实数据 data/telco.csv（7,043 行），
# 如果没有则现场生成同构演示数据，保证任何克隆都能跑通。
on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare data
        run: |
          if [ -f data/telco.csv ]; then
            echo "使用仓库内置真实数据"
            ls -l data/telco.csv
          else
            echo "未找到 telco.csv，生成演示数据"
            python src/make_demo_data.py --out data/_ci_demo.csv
            ls -l data/_ci_demo.csv
          fi

      - name: Train & evaluate
        run: |
          DATA=data/telco.csv
          [ -f "$DATA" ] || DATA=data/_ci_demo.csv
          echo "training on $DATA"
          python src/ml_churn.py --data "$DATA" --out results

      - name: Upload metrics & figures
        uses: actions/upload-artifact@v4
        with:
          name: ml-outputs
          path: results/
          retention-days: 14
